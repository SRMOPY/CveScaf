<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CveScaf {% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="loading-bar" id="loading-bar"></div>
<div class="scanlines"></div>
<div class="noise"></div>

<nav>
    <a href="/" class="nav-brand">
        <span class="brand-bracket">[</span>
        CveScaf
        <span class="brand-bracket">]</span>
    </a>
    <div class="nav-links">
        <a href="/lookup"  {% if request.path == '/lookup' %}class="active"{% endif %}>LOOKUP</a>
        <a href="/library" {% if request.path == '/library' %}class="active"{% endif %}>LIBRARY</a>
        <a href="/history" {% if request.path == '/history' %}class="active"{% endif %}>HISTORY</a>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <span>CveScaf — For authorized practice only</span>
    <span>Built by <a href="https://github.com/SRMOPY" target="_blank">SRMOPY</a></span>
</footer>

{% block scripts %}{% endblock %}
<script>
    // Loading bar on navigation
    const bar = document.getElementById("loading-bar");
    document.querySelectorAll("a").forEach(a => {
        if (a.href && !a.href.startsWith("#") && !a.target) {
            a.addEventListener("click", () => {
                bar.classList.add("active");
            });
        }
    });

    // Stop loading bar when page loads
    window.addEventListener("load", () => {
        bar.classList.remove("active");
        bar.style.width = "100%";
        setTimeout(() => { bar.style.width = "0%"; }, 300);
    });

    // Add spinner to search form submit
    const searchForms = document.querySelectorAll(".search-form");
    searchForms.forEach(form => {
        form.addEventListener("submit", () => {
            const btn = form.querySelector(".btn");
            if (btn) {
                btn.innerHTML = '<span class="spinner"></span> Searching...';
                btn.disabled = true;
            }
            bar.classList.add("active");
        });
    });
</script>
</body>
</html>
